name: Deploy LID API

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      target_vps:
        description: "VPS cible"
        required: true
        default: dev
        type: choice
        options:
          - dev
          - prod
      release_tag:
        description: "Image tag format vX.Y.Z"
        required: true
        type: string
      wipe_volumes:
        description: "vider volume"
        required: false
        default: false
        type: boolean
      wipe_shared_storage:
        description: "vider le dossier partagé des médias"
        required: false
        default: false
        type: boolean
      flush_cache:
        description: "vider le cache"
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  actions: write

concurrency:
  group: deploy-lid-${{ github.ref }}-${{ inputs.target_vps || 'dev' }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      LID_IMAGE_REPO: jeanemmanuel01/lid
      TARGET_VPS: ${{ inputs.target_vps || 'dev' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Resolve and validate release tag
        id: release
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "push" ]; then
            RELEASE_TAG="${{ github.ref_name }}"
          else
            RELEASE_TAG="${{ inputs.release_tag }}"
          fi

          if ! echo "${RELEASE_TAG}" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "Invalid tag format: ${RELEASE_TAG}. Expected: vX.Y.Z"
            exit 1
          fi

          SHORT_SHA="$(echo "${GITHUB_SHA}" | cut -c1-7)"
          RELEASE_IMAGE="${LID_IMAGE_REPO}:${RELEASE_TAG}"

          echo "release_tag=${RELEASE_TAG}" >> "${GITHUB_OUTPUT}"
          echo "short_sha=${SHORT_SHA}" >> "${GITHUB_OUTPUT}"
          echo "lid_image_release=${RELEASE_IMAGE}" >> "${GITHUB_OUTPUT}"
          echo "deploy_image=${RELEASE_IMAGE}" >> "${GITHUB_OUTPUT}"

      - name: Build phase (skip tests)
        working-directory: lid
        run: mvn -B -DskipTests clean compile

      - name: Generate deployment/ddl.sql with PostgreSQL dialect
        working-directory: lid
        run: |
          set -euo pipefail
          rm -f ../deployment/ddl.sql
          timeout 120s mvn -B -DskipTests spring-boot:run \
            -Dspring-boot.run.profiles=ddl-postgres \
            -Dspring-boot.run.arguments="--spring.main.web-application-type=none --spring.main.banner-mode=off" || true
          test -s ../deployment/ddl.sql

      - name: Login Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Compile and push images (jib build + tags)
        working-directory: lid
        run: >
          mvn -B -DskipTests compile jib:build
          -Djib.to.image="${{ steps.release.outputs.deploy_image }}"

      - name: Build deployment .env from GitHub secret by target
        env:
          LID_BUSINESS_ENV_FILE_DEV: ${{ secrets.LID_BUSINESS_ENV_FILE_DEV }}
          LID_BUSINESS_ENV_FILE_PROD: ${{ secrets.LID_BUSINESS_ENV_FILE_PROD }}
        run: |
          set -euo pipefail
          ensure_env_var() {
            local key="$1"
            local value="$2"
            if ! grep -Eq "^${key}=" deployment/.env; then
              echo "${key}=${value}" >> deployment/.env
            fi
          }
          if [ "${TARGET_VPS}" = "prod" ]; then
            LID_BUSINESS_ENV_FILE="${LID_BUSINESS_ENV_FILE_PROD:-}"
          else
            LID_BUSINESS_ENV_FILE="${LID_BUSINESS_ENV_FILE_DEV:-}"
          fi

          if [ -z "${LID_BUSINESS_ENV_FILE:-}" ]; then
            echo "Missing GitHub secret: LID_BUSINESS_ENV_FILE_${TARGET_VPS^^}"
            exit 1
          fi
          printf '%s\n' "${LID_BUSINESS_ENV_FILE}" > deployment/.env

          DOMAIN="$(grep -E '^DOMAIN=' deployment/.env | tail -n 1 | cut -d '=' -f 2-)"
          if [ -z "${DOMAIN:-}" ]; then
            echo "Missing DOMAIN in LID_BUSINESS_ENV_FILE_${TARGET_VPS^^}"
            exit 1
          fi
          ensure_env_var "LOCAL_STORAGE_BASE_PATH" "/opt/lid/storage"
          ensure_env_var "LOCAL_STORAGE_PUBLIC_BASE_URL" "/api/v1/cdn"
          ensure_env_var "LOCAL_STORAGE_CDN_BASE_URL" ""
          echo "LID_API_IMAGE=${{ steps.release.outputs.deploy_image }}" >> deployment/.env
          echo "Configured deployment image: ${{ steps.release.outputs.deploy_image }}"
          echo "Configured deployment domain: ${DOMAIN}"

      - name: Clean remote deployment directory
        uses: appleboy/ssh-action@v1.2.4
        with:
          host: ${{ env.TARGET_VPS == 'prod' && secrets.VPS_PROD_HOST || secrets.VPS_DEV_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ env.TARGET_VPS == 'prod' && secrets.VPS_PROD_SSH_KEY || secrets.VPS_DEV_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || '22' }}
          script: |
            set -euo pipefail
            mkdir -p ~/apps/lid
            mkdir -p ~/apps/lid/storage
            find ~/apps/lid -mindepth 1 -maxdepth 1 ! -name storage -exec rm -rf {} +

      - name: Upload deployment files (deployment/* -> ~/apps/lid/)
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ env.TARGET_VPS == 'prod' && secrets.VPS_PROD_HOST || secrets.VPS_DEV_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ env.TARGET_VPS == 'prod' && secrets.VPS_PROD_SSH_KEY || secrets.VPS_DEV_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || '22' }}
          source: "deployment/docker-compose.yml,deployment/.env,deployment/ddl.sql,deployment/scripts/**"
          target: "~/apps/lid"
          strip_components: 1
          overwrite: true

      - name: Deploy with docker compose
        uses: appleboy/ssh-action@v1.2.4
        with:
          host: ${{ env.TARGET_VPS == 'prod' && secrets.VPS_PROD_HOST || secrets.VPS_DEV_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ env.TARGET_VPS == 'prod' && secrets.VPS_PROD_SSH_KEY || secrets.VPS_DEV_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || '22' }}
          script: |
            set -euo pipefail
            cd ~/apps/lid
            find ./scripts -type f -name "*.sh" -exec chmod +x {} +
            mkdir -p ./storage

            WIPE_VOLUMES="${{ inputs.wipe_volumes || 'false' }}"
            if [ "${WIPE_VOLUMES}" = "true" ]; then
              docker compose down -v --remove-orphans
            else
              docker compose down --remove-orphans
            fi

            WIPE_SHARED_STORAGE="${{ inputs.wipe_shared_storage || 'false' }}"
            if [ "${WIPE_SHARED_STORAGE}" = "true" ]; then
              find ./storage -mindepth 1 -delete
            fi

            echo "Deploying image: ${{ steps.release.outputs.deploy_image }}"
            docker image rm "${{ steps.release.outputs.deploy_image }}" || true
            docker compose pull lid-api
            REPLICAS="${LID_API_REPLICAS:-2}"
            docker compose up -d --pull always --force-recreate --scale "lid-api=${REPLICAS}" lid-api

            FLUSH_CACHE="${{ inputs.flush_cache || 'false' }}"
            if [ "${FLUSH_CACHE}" = "true" ]; then
              ./scripts/redis/flush_redis_cache.sh
            fi

            API_CONTAINER_IDS="$(docker compose ps -q lid-api)"
            if [ -z "${API_CONTAINER_IDS}" ]; then
              echo "No lid-api containers found after deployment"
              docker compose ps
              exit 1
            fi

            for cid in ${API_CONTAINER_IDS}; do
              docker inspect "${cid}" --format 'Container {{.Name}} -> image: {{.Config.Image}}'
              docker inspect "${cid}" --format 'Container {{.Name}} -> image id: {{.Image}}'
            done

            docker compose ps

      - name: Cleanup workflow runs older than 1 day
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          CUTOFF_EPOCH="$(date -u -d '1 day ago' +%s)"

          gh run list \
            --workflow "${GITHUB_WORKFLOW}" \
            --status completed \
            --limit 100 \
            --json databaseId,createdAt \
          | jq -r --argjson cutoff "${CUTOFF_EPOCH}" --arg current "${GITHUB_RUN_ID}" '
              .[]
              | select((.databaseId | tostring) != $current)
              | select((.createdAt | fromdateiso8601) < $cutoff)
              | .databaseId
            ' \
          | while read -r run_id; do
              [ -z "${run_id}" ] && continue
              echo "Deleting workflow run ${run_id}"
              gh run delete "${run_id}"
            done
