name: Deploy Backoffice to Firebase Hosting

on:
  push:
    branches:
      - backoffice
  workflow_dispatch:
    inputs:
      target:
        description: "Site Firebase cible (staging = lidback-staging, production = lidback)"
        required: true
        default: staging
        type: choice
        options:
          - staging
          - production

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    env:
      # Un push sur la branche `backoffice` déploie en production ; un lancement manuel choisit la cible
      DEPLOY_TARGET: ${{ inputs.target || 'production' }}
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: npm ci

      # Les variables VITE_* (API, VITE_STOREFRONT_URL pour les liens « Accueil » / « Mon compte » du menu) viennent de
      # .env.production (npm run build) ou .env.staging (npm run build:staging) : staging -> https://lid-shop-staging.web.app,
      # production -> https://lidshopping.com. Une variable posée dans l'environnement de l'étape l'emporterait sur ces fichiers.
      - name: Build
        run: |
          if [ "${DEPLOY_TARGET}" = "staging" ]; then
            npm run build:staging
          else
            npm run build
          fi

      - name: Deploy to Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: '${{ secrets.GITHUB_TOKEN }}'
          firebaseServiceAccount: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_LID_SHOP }}'
          channelId: live
          projectId: lid-shop
          # Noms des cibles de firebase.json (production -> lidback, staging -> lidback-staging, voir .firebaserc)
          target: ${{ env.DEPLOY_TARGET }}
          entryPoint: .
