name: Deploy to Firebase Hosting on merge
on:
  push:
    branches:
      - frontend
  workflow_dispatch:
    inputs:
      target:
        description: "Site Firebase cible (staging = lid-shop-staging, production = lid-shop)"
        required: true
        default: staging
        type: choice
        options:
          - staging
          - production
jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    env:
      # Un push sur la branche `frontend` déploie en production ; un lancement manuel choisit la cible
      DEPLOY_TARGET: ${{ inputs.target || 'production' }}
    steps:
      - uses: actions/checkout@v4
      - run: npm ci
      - name: Build
        run: |
          if [ "${DEPLOY_TARGET}" = "staging" ]; then
            npm run build:staging
          else
            npm run build
          fi
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_LID_SHOP }}
          channelId: live
          projectId: lid-shop
          # Cibles de firebase.json : production -> lid-shop, staging -> lid-shop-staging (voir .firebaserc)
          target: ${{ env.DEPLOY_TARGET }}
